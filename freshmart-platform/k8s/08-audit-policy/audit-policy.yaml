# ─────────────────────────────────────────────────────────────────────────────
# FreshMart — Kubernetes Audit Policy
# Phase 4 CKS: Fixes kube-bench 1.2.16–1.2.19 + 3.2.1 + 3.2.2
#
# Strategy: log the minimum needed to detect attacks without flooding disk.
#
# Rule evaluation: FIRST matching rule wins — order matters.
# Levels: None < Metadata < Request < RequestResponse
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: audit.k8s.io/v1
kind: Policy

# Don't generate audit events for RequestReceived stage (reduces noise)
omitStages:
  - RequestReceived

rules:

  # ── Secrets / ConfigMaps / TokenReviews ───────────────────────────────────
  # Log ONLY Metadata (not the actual data) — avoids leaking secret values
  # into audit logs. CKS exam: this distinction is explicitly tested.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]

  # ── High-risk pod sub-resources ───────────────────────────────────────────
  # exec / portforward / proxy = attacker's primary post-compromise tools.
  # Log full RequestResponse so we capture the command and output.
  - level: RequestResponse
    resources:
      - group: ""
        resources:
          - pods/exec
          - pods/portforward
          - pods/proxy
          - services/proxy

  # ── Pod and workload mutations ────────────────────────────────────────────
  # Any create/update/patch/delete on pods or controllers — catches
  # malicious pod creation, image changes, and deployment tampering.
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: ""
        resources: ["pods", "replicationcontrollers"]
      - group: "apps"
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - group: "batch"
        resources: ["jobs", "cronjobs"]

  # ── RBAC changes ──────────────────────────────────────────────────────────
  # Privilege escalation via RBAC is a critical attack path.
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"
        resources:
          - roles
          - clusterroles
          - rolebindings
          - clusterrolebindings

  # ── Namespace changes ─────────────────────────────────────────────────────
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["namespaces"]

  # ── NetworkPolicy changes ─────────────────────────────────────────────────
  # Any change to NetworkPolicy is security-critical.
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "networking.k8s.io"
        resources: ["networkpolicies", "ingresses"]

  # ── PersistentVolume and StorageClass ─────────────────────────────────────
  - level: Metadata
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["persistentvolumes", "persistentvolumeclaims"]
      - group: "storage.k8s.io"
        resources: ["storageclasses"]

  # ── Node access ───────────────────────────────────────────────────────────
  - level: Metadata
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["nodes", "nodes/proxy", "nodes/log", "nodes/stats"]

  # ── Skip noisy read-only system calls ────────────────────────────────────
  # These generate huge volume with no security value.
  - level: None
    users:
      - system:kube-proxy
      - system:kube-scheduler
    verbs: ["get", "list", "watch"]

  - level: None
    userGroups:
      - system:nodes
    verbs: ["get", "list", "watch"]
    resources:
      - group: ""
        resources: ["nodes", "pods", "services", "endpoints", "configmaps"]

  - level: None
    users:
      - system:apiserver
    verbs: ["get", "list", "watch"]

  - level: None
    nonResourceURLs:
      - /healthz*
      - /readyz*
      - /livez*
      - /metrics

  # ── Default: log everything else at Metadata level ────────────────────────
  # Catch-all — ensures no request goes completely unrecorded.
  - level: Metadata
