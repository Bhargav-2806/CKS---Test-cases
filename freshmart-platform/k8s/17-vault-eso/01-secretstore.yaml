# =============================================================================
# ClusterSecretStore — vault-backend
# CKS Domain: Minimize Microservice Vulnerabilities (20%)
#
# A ClusterSecretStore is ESO's connection configuration to a secret backend
# (Vault in our case). It is cluster-scoped — all namespaces can reference it.
#
# This store:
#   - Connects to Vault at http://vault.tesco-security.svc.cluster.local:8200
#   - Authenticates using a static token (dev mode)
#   - Reads from the KV-v2 secrets engine mounted at "secret"
#
# All ExternalSecret objects in any namespace reference this store.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    description: "ESO connection to HashiCorp Vault. Auth: token (dev). Production: use kubernetes auth."
spec:
  provider:
    vault:
      # Vault server address — internal K8s DNS
      server: "http://vault.tesco-security.svc.cluster.local:8200"

      # KV-v2 secrets engine mount path
      # Secrets stored at: vault kv put secret/freshmart/... → path = "secret"
      path: "secret"
      version: "v2"    # KV version 2 (supports versioning + soft deletes)

      # Authentication: static token from K8s Secret (dev mode)
      # Production alternative: kubernetes auth (no static tokens)
      auth:
        tokenSecretRef:
          name:      vault-token          # Secret in external-secrets namespace
          namespace: external-secrets
          key:       token                # The token field in the Secret
