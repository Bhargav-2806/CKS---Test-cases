# =============================================================================
# ExternalSecrets — FreshMart
# CKS Domain: Minimize Microservice Vulnerabilities (20%)
#
# ExternalSecret = "I want K8s Secret <name> in <namespace>,
#                   populated with values from Vault path <path>"
#
# ESO watches these objects and:
#   1. Reads the secret value from Vault
#   2. Creates/updates the K8s Secret with the value
#   3. Refreshes every `refreshInterval` (1h here)
#
# The K8s Secret names MATCH the Phase 3 secret names exactly.
# Pods reference the same secret names — zero code/config changes needed.
#
# Migration from Phase 3 plain K8s Secrets:
#   kubectl delete secret db-credentials -n tesco-core
#   kubectl delete secret db-credentials -n tesco-payments
#   kubectl delete secret postgresql-credentials -n tesco-data
#   → ESO immediately recreates them from Vault data
# =============================================================================

# ─── tesco-core: db-credentials ──────────────────────────────────────────────
# Used by: product-service, cart-service, order-service
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: tesco-core
  annotations:
    description: "Database credentials for tesco-core services, sourced from Vault"
spec:
  # Sync interval — how often ESO polls Vault for changes
  refreshInterval: 1h

  # Which ClusterSecretStore to use
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  # The K8s Secret to create / update
  target:
    name: db-credentials          # Same name as Phase 3 Secret — pods unchanged
    creationPolicy: Owner         # ESO owns this Secret; deletes it if ExternalSecret deleted
    deletionPolicy: Delete        # Clean up the K8s Secret if this ExternalSecret is removed

  # Map Vault fields → K8s Secret keys
  data:
    - secretKey: DATABASE_URL     # Key in the K8s Secret
      remoteRef:
        key: secret/data/freshmart/database   # Vault path (KV-v2 adds /data/)
        property: url                          # Field within the Vault secret

---
# ─── tesco-payments: db-credentials ─────────────────────────────────────────
# Used by: payment-service
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: tesco-payments
  annotations:
    description: "Database credentials for payment-service, sourced from Vault"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/freshmart/database
        property: url

---
# ─── tesco-data: postgresql-credentials ──────────────────────────────────────
# Used by: postgresql StatefulSet (env vars for DB init)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-credentials
  namespace: tesco-data
  annotations:
    description: "PostgreSQL init credentials sourced from Vault"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Delete

  # Sync multiple fields from one Vault path
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: secret/data/freshmart/database
        property: db

    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/data/freshmart/database
        property: username

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/freshmart/database
        property: password
