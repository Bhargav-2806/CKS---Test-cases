# ─────────────────────────────────────────────────────────────────────────────
# FreshMart — NetworkPolicies
# CKS Domain: Cluster Setup (10%) + Minimize Microservice Vulnerabilities (20%)
#
# Strategy: DEFAULT-DENY-ALL in every namespace, then explicit allow rules.
# This is the most secure posture — if a policy is missing, traffic is blocked.
#
# Allow map:
#   ingress-nginx  →  tesco-frontend (port 3000)
#   ingress-nginx  →  tesco-core     (ports 8001/8002/8003)
#   tesco-frontend →  tesco-core     (port 8001/8002/8003)
#   tesco-core     →  tesco-data     (port 5432 — PostgreSQL)
#   tesco-core     →  tesco-messaging (port 9092 — Kafka)
#   tesco-core/order-service → tesco-payments (port 8004) ONLY
#   tesco-payments →  tesco-data     (port 5432 — PostgreSQL)
#   tesco-payments →  tesco-messaging (port 9092 — Kafka)
#   ALL namespaces →  kube-dns       (port 53 UDP/TCP)
# ─────────────────────────────────────────────────────────────────────────────

# ══ tesco-frontend ════════════════════════════════════════════════════════════

---
# Default deny all ingress + egress in tesco-frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tesco-frontend
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# Allow ingress-nginx → frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: tesco-frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000

---
# Allow frontend egress to tesco-core APIs + DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: tesco-frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Egress]
  egress:
    # DNS (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # tesco-core APIs
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-core
      ports:
        - port: 8001
        - port: 8002
        - port: 8003

# ══ tesco-core ════════════════════════════════════════════════════════════════

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tesco-core
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# Allow ingress-nginx → core services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-core
  namespace: tesco-core
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8001
        - port: 8002
        - port: 8003

---
# Allow core services egress: DNS + PostgreSQL + Kafka + payment-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-egress
  namespace: tesco-core
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (tesco-data)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-data
      ports:
        - port: 5432
    # Kafka (tesco-messaging)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-messaging
      ports:
        - port: 9092
    # payment-service (tesco-payments) — only order-service needs this
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-payments
      ports:
        - port: 8004
    # Inter-core service calls (cart→product, order→cart)
    - to:
        - podSelector: {}
      ports:
        - port: 8001
        - port: 8002
        - port: 8003

# ══ tesco-payments ════════════════════════════════════════════════════════════

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tesco-payments
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# Allow ONLY order-service in tesco-core to reach payment-service
# This is the key CKS isolation: no other pod can call payments
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-order-service
  namespace: tesco-payments
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-core
          podSelector:
            matchLabels:
              app: order-service
      ports:
        - port: 8004

---
# Allow payment-service egress: DNS + PostgreSQL + Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payment-egress
  namespace: tesco-payments
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-data
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-messaging
      ports:
        - port: 9092

# ══ tesco-data ════════════════════════════════════════════════════════════════

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tesco-data
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# Allow tesco-core + tesco-payments to reach PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: tesco-data
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-core
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-payments
      ports:
        - port: 5432

---
# Allow PostgreSQL egress only for DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-dns
  namespace: tesco-data
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ══ tesco-messaging ═══════════════════════════════════════════════════════════

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tesco-messaging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# Allow tesco-core + tesco-payments to reach Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress
  namespace: tesco-messaging
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-core
      ports:
        - port: 9092
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesco-payments
      ports:
        - port: 9092

---
# Kafka egress: DNS only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-messaging-dns
  namespace: tesco-messaging
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ══ tesco-monitoring ══════════════════════════════════════════════════════════
# Falco, Prometheus deployed in Phase 4.
# Default-deny is set now so Phase 4 only needs to add allow rules.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tesco-monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
