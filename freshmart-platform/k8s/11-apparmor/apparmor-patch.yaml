# ─────────────────────────────────────────────────────────────────────────────
# FreshMart — AppArmor securityContext patches
# Phase 4.4 — System Hardening
#
# These are REFERENCE patches showing how AppArmor is applied in K8s 1.30+
# via securityContext.appArmorProfile (replaces the old annotation method).
#
# To apply (requires AppArmor kernel support + profiles loaded on nodes):
#   kubectl apply -f k8s/11-apparmor/apparmor-patch.yaml
#
# Profiles must be loaded on EVERY worker node before pods are scheduled.
# ─────────────────────────────────────────────────────────────────────────────

# ── product-service ───────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: tesco-core
spec:
  template:
    spec:
      containers:
        - name: product-service
          securityContext:
            # Phase 3 controls (existing)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            # Phase 4.4: AppArmor profile (K8s 1.30+ syntax)
            appArmorProfile:
              type: Localhost
              localhostProfile: freshmart-python-service

