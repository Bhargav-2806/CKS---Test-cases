# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE Roles — for educational purposes only (not applied to FreshMart)
#
# FreshMart services do NOT need K8s API access — no Roles are bound to
# product-service-sa, cart-service-sa, etc.
#
# If a future service DID need API access, this is the correct pattern:
# ─────────────────────────────────────────────────────────────────────────────

# EXAMPLE: A health-check sidecar that needs to list pods in its own namespace
# Rule: minimum verbs, specific resources, NO wildcards, namespace-scoped
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: pod-reader
#   namespace: tesco-core
# rules:
#   - apiGroups: [""]
#     resources: ["pods"]
#     verbs: ["get", "list", "watch"]   # read-only — no create/delete/patch
#
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: pod-reader-binding
#   namespace: tesco-core
# subjects:
#   - kind: ServiceAccount
#     name: some-monitoring-sa      # explicit SA — never "default"
#     namespace: tesco-core
# roleRef:
#   kind: Role
#   name: pod-reader
#   apiGroup: rbac.authorization.k8s.io

# ─────────────────────────────────────────────────────────────────────────────
# ANTI-PATTERNS — never do these (CKS exam traps)
# ─────────────────────────────────────────────────────────────────────────────
#
# ❌ Wildcard resources:
#   rules:
#     - apiGroups: ["*"]
#       resources: ["*"]
#       verbs: ["*"]
#
# ❌ Binding to system:masters group:
#   subjects:
#     - kind: Group
#       name: system:masters
#
# ❌ ClusterRoleBinding to cluster-admin for an app SA:
#   roleRef:
#     kind: ClusterRole
#     name: cluster-admin
#
# ❌ Using default SA for workloads:
#   spec:
#     serviceAccountName: default   # never — always use a dedicated SA
