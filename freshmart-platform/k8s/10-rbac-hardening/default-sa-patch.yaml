# ─────────────────────────────────────────────────────────────────────────────
# FreshMart — Phase 4.3: RBAC Hardening
# CKS Domain: Cluster Hardening (15%)
# kube-bench: 5.1.5 + 5.1.6
#
# Problem: Every namespace gets a 'default' ServiceAccount automatically.
# By default, automountServiceAccountToken is TRUE on the default SA.
# Any pod that doesn't explicitly set serviceAccountName gets the default SA,
# and gets a token mounted — even if it never needs K8s API access.
#
# Fix: Set automountServiceAccountToken: false on the default SA in EVERY
# namespace so no pod accidentally inherits K8s API access.
#
# Note: Our custom SAs (product-service-sa, payment-service-sa, etc.) already
# have automountServiceAccountToken: false from Phase 3 (01-rbac.yaml).
# This file patches the default SAs we missed.
# ─────────────────────────────────────────────────────────────────────────────

---
# tesco-core default SA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tesco-core
  labels:
    app.kubernetes.io/part-of: freshmart
    rbac.phase: "4.3"
automountServiceAccountToken: false

---
