# =============================================================================
# Constraint: freshmart-require-resource-limits
# enforcementAction: deny — hard block
#
# All containers in application namespaces must declare CPU and memory limits.
# Our existing deployments already comply (set in Phase 3 Deployments).
# This constraint ensures any NEW or modified deployment cannot skip limits.
# =============================================================================
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireResourceLimits
metadata:
  name: freshmart-require-resource-limits
  annotations:
    description: "All containers must declare CPU and memory resource limits."
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - tesco-core
      - tesco-payments
      - tesco-frontend
      - tesco-data
