# =============================================================================
# ConstraintTemplate: K8sAllowedRepos
# Only images from whitelisted registries may be deployed.
# CKS Domain: Supply Chain Security (20%) — allowlist registries
# =============================================================================
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
  annotations:
    description: >
      Reject pods whose containers reference an image from a registry not
      in the allowed list. Prevents pulling from arbitrary public registries
      (e.g. anonymous Docker Hub) into production namespaces.
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos:
              type: array
              description: "List of allowed image prefixes (e.g. 'gcr.io/distroless/')"
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        # ─── helpers ──────────────────────────────────────────────────────────

        # Returns true if the image starts with any allowed prefix.
        image_allowed(image) {
          prefix := input.parameters.repos[_]
          startswith(image, prefix)
        }

        # ─── violations ───────────────────────────────────────────────────────

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not image_allowed(container.image)
          msg := sprintf(
            "Container '%v' uses image '%v' from a non-allowed registry. Allowed prefixes: %v",
            [container.name, container.image, input.parameters.repos]
          )
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          not image_allowed(container.image)
          msg := sprintf(
            "InitContainer '%v' uses image '%v' from a non-allowed registry. Allowed prefixes: %v",
            [container.name, container.image, input.parameters.repos]
          )
        }
