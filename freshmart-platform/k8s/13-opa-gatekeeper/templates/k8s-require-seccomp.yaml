# =============================================================================
# ConstraintTemplate: K8sRequireSeccomp
# Every pod must have a seccomp profile at pod OR container level.
# CKS Domain: System Hardening (15%) — syscall filtering
# =============================================================================
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequireseccomp
  annotations:
    description: >
      Reject pods that do not declare a seccomp profile. Without seccomp,
      containers can make any system call — including dangerous ones like
      ptrace, mount, and unshare — that enable container escapes.
      Minimum acceptable: RuntimeDefault. Preferred: Localhost (custom profile).
spec:
  crd:
    spec:
      names:
        kind: K8sRequireSeccomp
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequireseccomp

        # ─── helpers ──────────────────────────────────────────────────────────

        # Pod has a seccomp profile at pod level
        pod_has_seccomp {
          input.review.object.spec.securityContext.seccompProfile.type
        }

        # At least one container has a seccomp profile
        any_container_has_seccomp {
          input.review.object.spec.containers[_].securityContext.seccompProfile.type
        }

        # ─── violations ───────────────────────────────────────────────────────

        violation[{"msg": msg}] {
          not pod_has_seccomp
          not any_container_has_seccomp
          msg := sprintf(
            "Pod '%v' must declare a seccomp profile (spec.securityContext.seccompProfile). Use type: RuntimeDefault at minimum, or Localhost for a custom profile.",
            [input.review.object.metadata.name]
          )
        }

        # Reject Unconfined seccomp (explicitly disabled)
        violation[{"msg": msg}] {
          input.review.object.spec.securityContext.seccompProfile.type == "Unconfined"
          msg := sprintf(
            "Pod '%v' sets seccomp type: Unconfined which disables syscall filtering entirely. Use RuntimeDefault or Localhost.",
            [input.review.object.metadata.name]
          )
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.seccompProfile.type == "Unconfined"
          msg := sprintf(
            "Container '%v' sets seccomp type: Unconfined. Use RuntimeDefault or Localhost.",
            [container.name]
          )
        }
