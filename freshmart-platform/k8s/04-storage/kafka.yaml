# ─────────────────────────────────────────────────────────────────────────────
# FreshMart — Kafka StatefulSet (KRaft mode — no ZooKeeper)
# Namespace: tesco-messaging
# Image: bitnami/kafka:3.7
# ─────────────────────────────────────────────────────────────────────────────

---
# Headless service for broker DNS resolution
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: tesco-messaging
  labels:
    app: kafka
    app.kubernetes.io/part-of: freshmart
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
# ClusterIP service for application access
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: tesco-messaging
  labels:
    app: kafka
    app.kubernetes.io/part-of: freshmart
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: tesco-messaging
  labels:
    app: kafka
    app.kubernetes.io/part-of: freshmart
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/part-of: freshmart
    spec:
      serviceAccountName: kafka-sa
      automountServiceAccountToken: false

      # Bitnami Kafka runs as uid 1001 — compatible with baseline PSA
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001

      containers:
        - name: kafka
          image: ghcr.io/bitnami/kafka:3.9
          imagePullPolicy: IfNotPresent

          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093

          env:
            # KRaft mode — no ZooKeeper
            - name: KAFKA_CFG_NODE_ID
              value: "0"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.tesco-messaging.svc.cluster.local:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka-headless.tesco-messaging.svc.cluster.local:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            # Topics (auto-created on first publish)
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

          resources:
            requests:
              cpu:    "200m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          readinessProbe:
            exec:
              command:
                - kafka-topics.sh
                - --bootstrap-server
                - localhost:9092
                - --list
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
