# ─────────────────────────────────────────────────────────────────────────────
# FreshMart — Kubernetes Secrets
# CKS Domain: Minimize Microservice Vulnerabilities
#
# Phase 3: Plain K8s Secrets (base64 encoded values shown below).
# Phase 4: Replace with Vault + External Secrets Operator (no plaintext in Git).
#
# ⚠  Never commit real secrets to Git.
#    Values below are development-only credentials.
#
# To re-encode:  echo -n "value" | base64
# ─────────────────────────────────────────────────────────────────────────────

---
# PostgreSQL credentials — used by all app services
# postgres DB, user, password = "freshmart" (base64: ZnJlc2htYXJ0)
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: tesco-data
  labels:
    app: postgresql
    app.kubernetes.io/part-of: freshmart
type: Opaque
data:
  POSTGRES_DB:       ZnJlc2htYXJ0   # freshmart
  POSTGRES_USER:     ZnJlc2htYXJ0   # freshmart
  POSTGRES_PASSWORD: ZnJlc2htYXJ0   # freshmart

---
# DATABASE_URL for tesco-core services
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tesco-core
  labels:
    app.kubernetes.io/part-of: freshmart
type: Opaque
data:
  # postgresql://freshmart:freshmart@postgresql.tesco-data.svc.cluster.local:5432/freshmart
  DATABASE_URL: cG9zdGdyZXNxbDovL2ZyZXNobWFydDpmcmVzaG1hcnRAcG9zdGdyZXNxbC50ZXNjby1kYXRhLnN2Yy5jbHVzdGVyLmxvY2FsOjU0MzIvZnJlc2htYXJ0

---
# DATABASE_URL for tesco-payments (payment-service)
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tesco-payments
  labels:
    app.kubernetes.io/part-of: freshmart
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXNxbDovL2ZyZXNobWFydDpmcmVzaG1hcnRAcG9zdGdyZXNxbC50ZXNjby1kYXRhLnN2Yy5jbHVzdGVyLmxvY2FsOjU0MzIvZnJlc2htYXJ0
