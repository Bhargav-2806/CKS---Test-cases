# =============================================================================
# cert-manager ClusterIssuers — FreshMart CKS Project
# CKS Domain: Cluster Setup (10%) — Ingress with TLS
#
# Two-step CA chain (best practice):
#
#   Step 1 — selfsigned-issuer    (bootstrapper, creates the CA cert)
#   Step 2 — freshmart-ca cert    (the local CA, signed by selfsigned-issuer)
#   Step 3 — freshmart-ca-issuer  (signs actual TLS certs using the CA)
#
# Why two steps instead of one?
#   A plain selfSigned issuer issues certs that are each their own CA —
#   every certificate is untrusted to every other. A CA issuer issues certs
#   all signed by ONE root. Trust the CA once → all certs it signs are trusted.
#   This mirrors real-world PKI: trust the corporate CA, not individual certs.
# =============================================================================

# ─── Step 1: Bootstrap issuer (signs only the CA cert below) ─────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  annotations:
    description: "Bootstrap issuer — only used to create the FreshMart CA. Not used for app certs."
spec:
  selfSigned: {}

---
# ─── Step 2: FreshMart CA Certificate ────────────────────────────────────────
# This is the root CA for all FreshMart TLS certificates.
# Must live in cert-manager namespace (ClusterIssuer reads its Secret from there).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: freshmart-ca
  namespace: cert-manager
  annotations:
    description: "FreshMart local root CA. Trust this cert to trust all FreshMart HTTPS."
spec:
  isCA: true
  commonName: freshmart-local-ca
  subject:
    organizations:
      - FreshMart
    organizationalUnits:
      - Platform Security
  secretName: freshmart-ca-secret
  duration: 87600h    # 10 years — CA certs have long lifetimes
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
# ─── Step 3: CA ClusterIssuer (signs all app TLS certs) ─────────────────────
# All FreshMart TLS certificates reference this issuer.
# It reads the CA key from freshmart-ca-secret in cert-manager namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: freshmart-ca-issuer
  annotations:
    description: "FreshMart CA issuer — use this in all Certificate objects."
spec:
  ca:
    secretName: freshmart-ca-secret
